<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riley's Newspaper Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 900px;
      overflow: hidden;
    }

    .card-header {
      background: #1a1a2e;
      color: #fff;
      padding: 28px 32px;
    }
    .card-header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.3px; }
    .card-header p  { margin-top: 6px; font-size: 0.9rem; opacity: 0.7; }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 10px;
      background: #16a34a;
      color: #fff;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .card-body { padding: 32px; }

    .field { margin-bottom: 22px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
    label span { font-weight: 400; color: #9ca3af; margin-left: 4px; }

    input[type="text"], select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, select:focus { border-color: #6366f1; }

    .upload-area {
      border: 2px dashed #d1d5db;
      border-radius: 10px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .upload-area:hover, .upload-area.drag { border-color: #6366f1; background: #f5f3ff; }
    .upload-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-icon { font-size: 2.2rem; margin-bottom: 8px; }
    .upload-area p  { color: #6b7280; font-size: 0.9rem; }
    .upload-area strong { color: #4f46e5; }
    #file-name { margin-top: 8px; font-size: 0.85rem; color: #4f46e5; font-weight: 600; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }
    button[type="submit"]:hover   { background: #4338ca; }
    button[type="submit"]:disabled { background: #a5b4fc; cursor: not-allowed; }

    #progress-panel {
      display: none;
      margin-top: 28px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-header {
      background: #f9fafb;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      border-bottom: 1.5px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid #d1d5db;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #log-box {
      padding: 14px 16px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #374151;
      max-height: 220px;
      overflow-y: auto;
      background: #fff;
      line-height: 1.7;
    }
    #log-box .line-error { color: #dc2626; }

    #results-panel { display: none; margin-top: 20px; }

    .result-card {
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      border-radius: 10px;
      padding: 20px 22px;
    }
    .result-card h3 { color: #15803d; font-size: 1rem; margin-bottom: 10px; }
    .result-meta { font-size: 0.85rem; color: #374151; line-height: 1.8; }
    .result-meta span { font-weight: 600; color: #111827; }

    /* Selection table */
    .table-section {
      margin-top: 16px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .table-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #f9fafb;
      border-bottom: 1.5px solid #e5e7eb;
      flex-wrap: wrap;
    }

    .select-all-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      user-select: none;
    }

    .sel-count {
      font-size: 0.82rem;
      color: #6b7280;
      flex: 1;
    }

    .dl-btns { display: flex; gap: 8px; flex-wrap: wrap; }

    .dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dl-btn:hover { background: #15803d; }
    .dl-btn:disabled { background: #86efac; cursor: not-allowed; }

    .table-wrap {
      overflow-x: auto;
      max-height: 420px;
      overflow-y: auto;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.81rem;
    }

    .results-table th {
      position: sticky;
      top: 0;
      background: #f3f4f6;
      padding: 8px 10px;
      text-align: left;
      font-weight: 600;
      color: #374151;
      white-space: nowrap;
      border-bottom: 1.5px solid #e5e7eb;
      z-index: 1;
    }

    .results-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: top;
      color: #111827;
    }

    .results-table tr:last-child td { border-bottom: none; }
    .results-table tr:hover td { background: #f9fafb; }
    .results-table tr.row-selected td { background: #eff6ff; }

    .td-text { max-width: 260px; word-wrap: break-word; }
    .td-center { text-align: center; }
    .td-meta { color: #6b7280; max-width: 140px; word-wrap: break-word; }

    .badge-hl {
      display: inline-block;
      padding: 2px 8px;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 12px;
      font-size: 0.74rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-sub {
      display: inline-block;
      padding: 2px 8px;
      background: #fce7f3;
      color: #9d174d;
      border-radius: 12px;
      font-size: 0.74rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .error-card {
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      border-radius: 10px;
      padding: 18px 20px;
      color: #b91c1c;
      font-size: 0.9rem;
    }
    .error-card strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <h1>Newspaper Analyzer</h1>
    <p>Upload a newspaper PDF to classify headlines, subheadlines, body text and image captions</p>
    <span class="badge">Powered by Claude Vision</span>
  </div>

  <div class="card-body">
    <form id="analyzeForm">

      <div class="field">
        <label>Newspaper PDFs</label>
        <div class="upload-area" id="dropZone">
          <input type="file" name="pdf" accept=".pdf" id="pdfInput" multiple />
          <div class="upload-icon">📰</div>
          <p><strong>Click to upload</strong> or drag and drop</p>
          <p>PDF files only · Max 100 MB each · Multiple files supported</p>
          <div id="file-name"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Pages <span>(optional)</span></label>
          <input type="text" name="pages" placeholder="e.g. 1,2,3 (default: all)" />
        </div>
        <div class="field">
          <label>Export Format</label>
          <select name="format">
            <option value="both">CSV + Excel (.xlsx)</option>
            <option value="csv">CSV only</option>
            <option value="xlsx">Excel only</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submitBtn">Analyze Newspaper</button>
    </form>

    <div id="progress-panel">
      <div class="progress-header">
        <div class="spinner" id="spinner"></div>
        <span id="progress-title">Analyzing...</span>
      </div>
      <div id="log-box"></div>
    </div>

    <div id="results-panel"></div>
  </div>
</div>

<script>
  const pdfInput = document.getElementById('pdfInput');
  const dropZone = document.getElementById('dropZone');
  const fileName = document.getElementById('file-name');

  let currentJobId = null;

  function showFileNames(files) {
    if (!files || files.length === 0) { fileName.textContent = ''; return; }
    if (files.length === 1) {
      fileName.textContent = files[0].name;
    } else {
      fileName.textContent = `${files.length} files selected: ${Array.from(files).map(f => f.name).join(', ')}`;
    }
  }

  pdfInput.addEventListener('change', () => showFileNames(pdfInput.files));
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag');
    if (e.dataTransfer.files.length) {
      pdfInput.files = e.dataTransfer.files;
      showFileNames(e.dataTransfer.files);
    }
  });

  document.getElementById('analyzeForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('submitBtn');
    const progressPanel = document.getElementById('progress-panel');
    const resultsPanel = document.getElementById('results-panel');
    const logBox = document.getElementById('log-box');

    if (!form.pdf.files.length) { alert('Please select at least one PDF file.'); return; }

    btn.disabled = true;
    btn.textContent = 'Uploading...';
    logBox.innerHTML = '';
    progressPanel.style.display = 'block';
    resultsPanel.style.display = 'none';
    document.getElementById('progress-title').textContent = 'Analyzing...';
    document.getElementById('spinner').style.display = 'block';

    const formData = new FormData(form);
    let jobId;

    try {
      const res = await fetch('/analyze', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      jobId = data.job_id;
    } catch (err) {
      showError(err.message);
      btn.disabled = false;
      btn.textContent = 'Analyze Newspaper';
      return;
    }

    btn.textContent = 'Analyzing...';

    const evtSource = new EventSource(`/stream/${jobId}`);
    evtSource.onmessage = e => {
      const event = JSON.parse(e.data);
      if (event.type === 'ping') return;
      if (event.type === 'log') {
        appendLog(event.message, 'line-log');
      } else if (event.type === 'done') {
        evtSource.close();
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('progress-title').textContent = 'Complete';
        showResults(event);
        btn.disabled = false;
        btn.textContent = 'Analyze Another';
      } else if (event.type === 'error') {
        evtSource.close();
        showError(event.message);
        btn.disabled = false;
        btn.textContent = 'Analyze Newspaper';
      }
    };
    evtSource.onerror = () => {
      evtSource.close();
      showError('Connection lost. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Analyze Newspaper';
    };
  });

  function appendLog(msg, cls) {
    const logBox = document.getElementById('log-box');
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = '› ' + msg;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showResults(event) {
    currentJobId = event.job_id;
    const rows = event.rows || [];
    const panel = document.getElementById('results-panel');
    panel.style.display = 'block';

    let html = `
      <div class="result-card">
        <h3>✅ Analysis Complete</h3>
        <div class="result-meta">
          <div>Newspaper: <span>${escHtml(event.newspaper)}</span></div>
          <div>Files processed: <span>${escHtml(event.date)}</span></div>
          <div>Total elements: <span>${event.total}</span></div>
          <div>API cost: <span>${escHtml(event.cost)}</span></div>
          <div>Tokens used: <span>${escHtml(event.tokens)}</span></div>
        </div>
      </div>`;

    if (rows.length > 0) {
      html += `
      <div class="table-section">
        <div class="table-controls">
          <label class="select-all-label">
            <input type="checkbox" id="selectAll" onchange="toggleAll(this)" checked>
            Select all
          </label>
          <span class="sel-count" id="selCount">${rows.length} of ${rows.length} selected</span>
          <div class="dl-btns">
            <button class="dl-btn" onclick="downloadSelected('csv')">⬇ Download CSV</button>
            <button class="dl-btn" onclick="downloadSelected('xlsx')">⬇ Download Excel</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="results-table">
            <thead>
              <tr>
                <th></th>
                <th>Type</th>
                <th>Text</th>
                <th>Newspaper</th>
                <th>Date</th>
                <th>Has #</th>
                <th>Names</th>
                <th>Locations</th>
                <th>Image</th>
              </tr>
            </thead>
            <tbody>`;

      rows.forEach((row, i) => {
        const badge = row.content_type === 'headline'
          ? `<span class="badge-hl">Headline</span>`
          : `<span class="badge-sub">Subheadline</span>`;
        html += `
              <tr class="row-selected" data-index="${i}">
                <td><input type="checkbox" class="row-check" data-index="${i}" checked onchange="onRowCheck(this)"></td>
                <td>${badge}</td>
                <td class="td-text">${escHtml(row.text)}</td>
                <td class="td-meta">${escHtml(row.newspaper_name)}</td>
                <td class="td-meta">${escHtml(row.date)}</td>
                <td class="td-center">${escHtml(row.contains_number)}</td>
                <td class="td-meta">${escHtml(row.name_mentioned) || '—'}</td>
                <td class="td-meta">${escHtml(row.location_mentioned) || '—'}</td>
                <td class="td-center">${escHtml(row.image_detected)}</td>
              </tr>`;
      });

      html += `
            </tbody>
          </table>
        </div>
      </div>`;
    }

    panel.innerHTML = html;
  }

  function onRowCheck(cb) {
    const tr = cb.closest('tr');
    tr.classList.toggle('row-selected', cb.checked);
    updateCount();
  }

  function toggleAll(cb) {
    document.querySelectorAll('.row-check').forEach(c => {
      c.checked = cb.checked;
      c.closest('tr').classList.toggle('row-selected', cb.checked);
    });
    updateCount();
  }

  function updateCount() {
    const checked = document.querySelectorAll('.row-check:checked').length;
    const total   = document.querySelectorAll('.row-check').length;
    const el = document.getElementById('selCount');
    if (el) el.textContent = `${checked} of ${total} selected`;
    const sa = document.getElementById('selectAll');
    if (sa) {
      sa.checked = checked === total;
      sa.indeterminate = checked > 0 && checked < total;
    }
  }

  async function downloadSelected(fmt) {
    const indices = [...document.querySelectorAll('.row-check:checked')]
      .map(cb => parseInt(cb.dataset.index));
    if (indices.length === 0) {
      alert('Please select at least one row to download.');
      return;
    }
    try {
      const res = await fetch('/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ job_id: currentJobId, indices, format: fmt }),
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      data.files.forEach(f => {
        const a = document.createElement('a');
        a.href = f.url;
        a.download = f.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    } catch (err) {
      alert('Download failed: ' + err.message);
    }
  }

  function showError(msg) {
    const panel = document.getElementById('results-panel');
    panel.style.display = 'block';
    panel.innerHTML = `<div class="error-card"><strong>Error</strong>${escHtml(msg)}</div>`;
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('progress-title').textContent = 'Failed';
  }
</script>
</body>
</html>
